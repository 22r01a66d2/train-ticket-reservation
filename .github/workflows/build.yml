name: Build and Deploy Train Ticket Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build WAR file
      - name: Build application with Maven
        run: mvn clean package

      # 4. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: target/*.war

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 5. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      # 6. Copy WAR to DEV EC2
      - name: Deploy WAR to DEV
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      # 7. Deploy WAR into Tomcat
      - name: Restart Tomcat and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo -u tomcat /opt/tomcat/bin/shutdown.sh || true
            sleep 5
            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war
            sudo -u tomcat /opt/tomcat/bin/startup.sh
            sleep 10
            sudo ss -lntp | grep 8080
  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      # 1. Download the WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      # 2. Copy WAR to TEST EC2
      - name: Deploy WAR to TEST
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      # 3. Deploy WAR into Tomcat
      - name: Restart Tomcat and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo -u tomcat /opt/tomcat/bin/shutdown.sh || true
            sleep 5
            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war
            sudo -u tomcat /opt/tomcat/bin/startup.sh
            sleep 10
            sudo ss -lntp | grep 8080
  deploy-preprod:
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      - name: Deploy WAR to PRE-PROD
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      - name: Restart Tomcat and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo -u tomcat /opt/tomcat/bin/shutdown.sh || true
            sleep 5
            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war
            sudo -u tomcat /opt/tomcat/bin/startup.sh
            sleep 10
            sudo ss -lntp | grep 8080
  deploy-prod:
    needs: deploy-preprod
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      - name: Deploy WAR to PROD
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      - name: Restart Tomcat and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo -u tomcat /opt/tomcat/bin/shutdown.sh || true
            sleep 5
            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war
            sudo -u tomcat /opt/tomcat/bin/startup.sh
            sleep 10
            sudo ss -lntp | grep 8080
