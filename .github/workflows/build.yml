name: Build and Deploy Train Ticket Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # 1. BUILD
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build application with Maven
        run: mvn clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: target/*.war


  # ==========================================
  # 2. DEPLOY TO DEV
  # ==========================================
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      - name: Deploy WAR to DEV
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      - name: Restart Tomcat and deploy to DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop tomcat || true
            sleep 5

            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT

            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war

            sudo systemctl start tomcat
            sleep 10

            sudo systemctl status tomcat --no-pager
            sudo ss -lntp | grep 8080

            curl -f http://localhost:8080/TrainBook-1.0.0-SNAPSHOT/


  # ==========================================
  # 3. DEPLOY TO TEST
  # ==========================================
  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      - name: Deploy WAR to TEST
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      - name: Restart Tomcat and deploy to TEST
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop tomcat || true
            sleep 5

            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT

            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war

            sudo systemctl start tomcat
            sleep 10

            sudo systemctl status tomcat --no-pager
            sudo ss -lntp | grep 8080

            curl -f http://localhost:8080/TrainBook-1.0.0-SNAPSHOT/


  # ==========================================
  # 4. DEPLOY TO PRE-PROD
  # ==========================================
  deploy-preprod:
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      - name: Deploy WAR to PRE-PROD
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      - name: Restart Tomcat and deploy to PRE-PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop tomcat || true
            sleep 5

            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT

            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war

            sudo systemctl start tomcat
            sleep 10

            sudo systemctl status tomcat --no-pager
            sudo ss -lntp | grep 8080

            curl -f http://localhost:8080/TrainBook-1.0.0-SNAPSHOT/


  # ==========================================
  # 5. DEPLOY TO PROD
  # ==========================================
  deploy-prod:
    needs: deploy-preprod
    runs-on: ubuntu-latest

    # GitHub Environment with required reviewer
    environment: PROD

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: war

      - name: Deploy WAR to PROD
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "war/*.war"
          target: "/tmp/"

      - name: Restart Tomcat and deploy to PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop tomcat || true
            sleep 5

            sudo rm -f /opt/tomcat/webapps/*.war
            sudo rm -rf /opt/tomcat/webapps/TrainBook-1.0.0-SNAPSHOT

            sudo cp /tmp/*.war /opt/tomcat/webapps/
            sudo chown tomcat:tomcat /opt/tomcat/webapps/*.war

            sudo systemctl start tomcat
            sleep 10

            sudo systemctl status tomcat --no-pager
            sudo ss -lntp | grep 8080

            curl -f http://localhost:8080/TrainBook-1.0.0-SNAPSHOT/
